[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eastnine-github-search"
version = "0.1.0"
description = "MCP server for searching scripts in personal GitHub repositories using natural language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
eastnine-github-search = "eastnine_github_search.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
